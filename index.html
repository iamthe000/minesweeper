<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マインスイーパ</title>
<style>
    body {
        background-color: #2c2c2c;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: 'MS Sans Serif', 'Segoe UI', Tahoma, sans-serif;
        -webkit-text-size-adjust: 100%;
    }
    
    .game-outer {
        max-width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    .game-container {
        background-color: #c0c0c0;
        padding: 6px;
        border-top: 3px solid #ffffff;
        border-left: 3px solid #ffffff;
        border-right: 3px solid #7b7b7b;
        border-bottom: 3px solid #7b7b7b;
        user-select: none;
        -webkit-user-select: none;
    }

    .header {
        background-color: #c0c0c0;
        border-top: 3px solid #7b7b7b;
        border-left: 3px solid #7b7b7b;
        border-right: 3px solid #ffffff;
        border-bottom: 3px solid #ffffff;
        padding: 5px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }

    .lcd {
        background-color: #000000;
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 24px;
        width: 48px;
        text-align: right;
        padding: 2px;
        border-top: 2px solid #7b7b7b;
        border-left: 2px solid #7b7b7b;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        line-height: 1;
    }

    .reset-btn {
        width: 32px;
        height: 32px;
        background-color: #c0c0c0;
        border-top: 3px solid #ffffff;
        border-left: 3px solid #ffffff;
        border-right: 3px solid #7b7b7b;
        border-bottom: 3px solid #7b7b7b;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
    }
    .reset-btn:active {
        border-top: 3px solid #7b7b7b;
        border-left: 3px solid #7b7b7b;
        border-right: 3px solid #ffffff;
        border-bottom: 3px solid #ffffff;
        background-color: #b0b0b0;
    }

    /* スマホはみ出し対策のスクロールラッパー */
    .grid-wrapper {
        max-width: 100%;
        overflow-x: auto;
        background-color: #7b7b7b;
        border-top: 3px solid #7b7b7b;
        border-left: 3px solid #7b7b7b;
        border-right: 3px solid #ffffff;
        border-bottom: 3px solid #ffffff;
        -webkit-overflow-scrolling: touch;
    }

    .grid {
        display: grid;
        margin: 0 auto;
        touch-action: manipulation;
    }

    .cell {
        width: 26px;
        height: 26px;
        background-color: #c0c0c0;
        border-top: 2px solid #ffffff;
        border-left: 2px solid #ffffff;
        border-right: 2px solid #7b7b7b;
        border-bottom: 2px solid #7b7b7b;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 16px;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .cell.revealed {
        border: 1px solid #7b7b7b;
        background-color: #c0c0c0;
    }

    .cell.mine-death {
        background-color: #ff0000;
    }

    .controls {
        margin-top: 8px;
        text-align: center;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px;
    }

    .action-btn {
        background-color: #c0c0c0;
        border-top: 2px solid #ffffff;
        border-left: 2px solid #ffffff;
        border-right: 2px solid #7b7b7b;
        border-bottom: 2px solid #7b7b7b;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        color: #000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
    }
    .action-btn:active, .action-btn.active {
        border-top: 2px solid #7b7b7b;
        border-left: 2px solid #7b7b7b;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        background-color: #e0e0e0;
    }
    .action-btn:disabled {
        color: #7b7b7b;
        cursor: not-allowed;
    }

    .mode-selector {
        margin-top: 8px;
        display: flex;
        justify-content: center;
        gap: 8px;
    }
    .mode-selector .action-btn {
        flex: 1;
        max-width: 120px;
        font-size: 14px;
        padding: 8px 0;
    }

    .num-1 { color: #0000ff; }
    .num-2 { color: #008000; }
    .num-3 { color: #ff0000; }
    .num-4 { color: #000080; }
    .num-5 { color: #800000; }
    .num-6 { color: #008080; }
    .num-7 { color: #000000; }
    .num-8 { color: #808080; }
</style>
</head>
<body>

<div class="game-outer">
    <div class="game-container">
        <div class="header">
            <div class="lcd" id="mine-count">010</div>
            <div class="reset-btn" id="reset-btn">🙂</div>
            <div class="lcd" id="timer">000</div>
        </div>
        <div class="grid-wrapper">
            <div class="grid" id="grid"></div>
        </div>
    </div>
    
    <div class="mode-selector">
        <button class="action-btn active" id="mode-dig">⛏️ 掘る</button>
        <button class="action-btn" id="mode-flag">🚩 旗 / ❓</button>
    </div>

    <div class="controls">
        <select id="difficulty" class="action-btn">
            <option value="9,9,10">初級 (9x9, 10個)</option>
            <option value="16,16,40">中級 (16x16, 40個)</option>
        </select>
        <button class="action-btn" id="undo-btn" disabled>1手戻る</button>
        <button class="action-btn" id="answer-btn">答え合わせ</button>
    </div>
</div>

<script>
    let ROWS = 9;
    let COLS = 9;
    let MINES = 10;
    
    let board = [];
    let isFirstClick = true;
    let gameOver = false;
    let flagsPlaced = 0;
    let timerInterval = null;
    let timeElapsed = 0;
    
    let currentMode = 'dig'; // 'dig' または 'flag'
    let historyStack = [];  // 行動履歴スタック (Undo用)

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset-btn');
    const answerBtn = document.getElementById('answer-btn');
    const undoBtn = document.getElementById('undo-btn');
    const difficultySelect = document.getElementById('difficulty');
    const modeDigBtn = document.getElementById('mode-dig');
    const modeFlagBtn = document.getElementById('mode-flag');

    function init() {
        clearInterval(timerInterval);
        timeElapsed = 0;
        timerEl.textContent = '000';
        isFirstClick = true;
        gameOver = false;
        flagsPlaced = 0;
        resetBtn.textContent = '🙂';
        historyStack = [];
        updateUndoButton();
        
        const diffValues = difficultySelect.value.split(',').map(Number);
        ROWS = diffValues[0];
        COLS = diffValues[1];
        MINES = diffValues[2];

        updateMineCount();
        
        gridEl.style.gridTemplateColumns = `repeat(${COLS}, 26px)`;
        gridEl.innerHTML = '';
        board = [];

        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                const cellEl = document.createElement('div');
                cellEl.classList.add('cell');
                cellEl.dataset.r = r;
                cellEl.dataset.c = c;
                
                // PC用右クリック / スマホ用長押しメニューの禁止
                cellEl.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    toggleMark(r, c);
                });

                cellEl.addEventListener('mousedown', (e) => {
                    if (gameOver) return;
                    if (e.button === 0 && currentMode === 'dig') resetBtn.textContent = '😮';
                });

                cellEl.addEventListener('mouseup', handleMouseUp);

                // PC用ダブルクリックコード機能
                cellEl.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    chordReveal(r, c);
                });

                gridEl.appendChild(cellEl);
                row.push({
                    r, c, el: cellEl,
                    isMine: false, isRevealed: false, markState: 0, neighborMines: 0
                });
            }
            board.push(row);
        }
    }

    // 履歴を保存する関数
    function saveHistory() {
        const snapshot = {
            boardState: board.map(row => row.map(cell => ({
                isRevealed: cell.isRevealed,
                markState: cell.markState
            }))),
            flagsPlaced: flagsPlaced,
            gameOver: gameOver
        };
        historyStack.push(snapshot);
        updateUndoButton();
    }

    // 1手戻る (Undo)
    function undo() {
        if (historyStack.length === 0) return;

        const snapshot = historyStack.pop();
        flagsPlaced = snapshot.flagsPlaced;
        
        const wasGameOver = gameOver;
        gameOver = snapshot.gameOver;

        if (wasGameOver && !gameOver) {
            resetBtn.textContent = '🙂';
            startTimer();
        }

        // 盤面状態の復元
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = board[r][c];
                const saved = snapshot.boardState[r][c];
                
                cell.isRevealed = saved.isRevealed;
                cell.markState = saved.markState;
                
                // 表示とスタイルのリセット
                cell.el.className = 'cell';
                if (cell.isRevealed) {
                    cell.el.classList.add('revealed');
                    if (cell.isMine) {
                        cell.el.classList.add('mine-death');
                        cell.el.textContent = '💣';
                    } else if (cell.neighborMines > 0) {
                        cell.el.textContent = cell.neighborMines;
                        cell.el.classList.add(`num-${cell.neighborMines}`);
                    } else {
                        cell.el.textContent = '';
                    }
                } else {
                    updateCellMarkDisplay(cell);
                }
            }
        }
        updateMineCount();
        updateUndoButton();
    }

    function updateUndoButton() {
        undoBtn.disabled = historyStack.length === 0;
    }

    function generateSolvableBoard(startR, startC) {
        let attempts = 0;
        const maxAttempts = 300;

        while (attempts < maxAttempts) {
            attempts++;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    board[r][c].isMine = false;
                    board[r][c].neighborMines = 0;
                }
            }

            let minesPlaced = 0;
            while (minesPlaced < MINES) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                if (Math.abs(r - startR) <= 1 && Math.abs(c - startC) <= 1) continue;

                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            calculateNeighbors();

            if (isBoardSolvable(startR, startC)) return;
        }
    }

    function calculateNeighbors() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c].isMine) continue;
                let count = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) count++;
                    }
                }
                board[r][c].neighborMines = count;
            }
        }
    }

    function isBoardSolvable(startR, startC) {
        let simState = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        let revealedCount = 0;

        function simReveal(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS || simState[r][c] !== 0) return;
            simState[r][c] = 1;
            revealedCount++;
            if (board[r][c].neighborMines === 0) {
                for(let dr=-1; dr<=1; dr++){
                    for(let dc=-1; dc<=1; dc++){
                        simReveal(r+dr, c+dc);
                    }
                }
            }
        }

        simReveal(startR, startC);

        let progress = true;
        while(progress) {
            progress = false;
            for(let r=0; r<ROWS; r++){
                for(let c=0; c<COLS; c++){
                    if (simState[r][c] === 1 && board[r][c].neighborMines > 0) {
                        let unrevealed = [];
                        let flagged = 0;
                        for(let dr=-1; dr<=1; dr++){
                            for(let dc=-1; dc<=1; dc++){
                                let nr = r+dr, nc = c+dc;
                                if(nr>=0 && nr<ROWS && nc>=0 && nc<COLS) {
                                    if(simState[nr][nc] === 0) unrevealed.push({r: nr, c: nc});
                                    if(simState[nr][nc] === 2) flagged++;
                                }
                            }
                        }

                        let target = board[r][c].neighborMines;
                        if (unrevealed.length > 0 && target === flagged + unrevealed.length) {
                            unrevealed.forEach(cell => { simState[cell.r][cell.c] = 2; progress = true; });
                        }
                        else if (unrevealed.length > 0 && target === flagged) {
                            unrevealed.forEach(cell => { simReveal(cell.r, cell.c); progress = true; });
                        }
                    }
                }
            }
        }
        return revealedCount === (ROWS * COLS - MINES);
    }

    function handleMouseUp(e) {
        if (gameOver) return;
        resetBtn.textContent = '🙂';
        
        const r = parseInt(e.target.dataset.r);
        const c = parseInt(e.target.dataset.c);

        if (e.button === 0) { // 左クリックまたはスマホタップ
            if (currentMode === 'dig') {
                if (!board[r][c].isRevealed && board[r][c].markState !== 1) {
                    saveHistory(); // 掘る前に履歴を保存
                    revealCell(r, c);
                }
            } else {
                toggleMark(r, c);
            }
        }
    }

    function revealCell(r, c) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
        let cell = board[r][c];
        if (cell.isRevealed || cell.markState === 1) return;

        if (isFirstClick) {
            isFirstClick = false;
            generateSolvableBoard(r, c);
            startTimer();
        }

        cell.isRevealed = true;
        cell.el.classList.add('revealed');
        cell.el.textContent = ''; 

        if (cell.isMine) {
            cell.el.classList.add('mine-death');
            cell.el.textContent = '💣';
            triggerGameOver(false);
            return;
        }

        if (cell.neighborMines > 0) {
            cell.el.textContent = cell.neighborMines;
            cell.el.classList.add(`num-${cell.neighborMines}`);
        } else {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    revealCell(r + dr, c + dc);
                }
            }
        }
        checkWin();
    }


    function toggleMark(r, c) {
        if (gameOver || isFirstClick) return;
        let cell = board[r][c];
        if (cell.isRevealed) return;

        saveHistory(); // 状態変更前に履歴を保存

        const prevState = cell.markState;
        cell.markState = (cell.markState + 1) % 3;

        if (prevState === 1) flagsPlaced--;
        if (cell.markState === 1) flagsPlaced++;

        updateCellMarkDisplay(cell);
        updateMineCount();
    }

    function updateCellMarkDisplay(cell) {
        if (cell.markState === 1) {
            cell.el.textContent = '🚩';
        } else if (cell.markState === 2) {
            cell.el.textContent = '❓';
        } else {
            cell.el.textContent = '';
        }
    }
    
    // コード機能
    function chordReveal(r, c) {
        if (gameOver) return;
        let cell = board[r][c];
        if (!cell.isRevealed || cell.neighborMines === 0) return;
        
        let flaggedNeighbors = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (board[nr][nc].markState === 1) flaggedNeighbors++;
                }
            }
        }
        
        if (flaggedNeighbors === cell.neighborMines) {
            let willReveal = false;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (board[nr][nc].markState !== 1 && !board[nr][nc].isRevealed) willReveal = true;
                    }
                }
            }

            if (willReveal) {
                saveHistory();
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            if (board[nr][nc].markState !== 1 && !board[nr][nc].isRevealed) revealCell(nr, nc);
                        }
                    }
                }
            }
        }
    }

    function updateMineCount() {
        let count = MINES - flagsPlaced;
        mineCountEl.textContent = count.toString().padStart(3, '0').replace('-', '-0');
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeElapsed++;
            if (timeElapsed > 999) timeElapsed = 999;
            timerEl.textContent = timeElapsed.toString().padStart(3, '0');
        }, 1000);
    }

    function showAnswer() {
        if (isFirstClick) return;
        saveHistory();
        triggerGameOver(false, true);
    }

    function triggerGameOver(isWin, isAnswerCheck = false) {
        gameOver = true;
        clearInterval(timerInterval);
        
        if (isWin) {
            resetBtn.textContent = '😎';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].isMine && board[r][c].markState !== 1) {
                        board[r][c].markState = 1;
                        board[r][c].el.textContent = '🚩';
                        flagsPlaced++;
                    }
                }
            }
            updateMineCount();
        } else {
            resetBtn.textContent = isAnswerCheck ? '😐' : '😵';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let cell = board[r][c];
                    if (cell.isMine && cell.markState !== 1) {
                        cell.el.classList.add('revealed');
                        cell.el.textContent = '💣';
                    } else if (!cell.isMine && cell.markState === 1) {
                        cell.el.textContent = '❌';
                    }
                }
            }
        }
    }

    function checkWin() {
        let revealedCells = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c].isRevealed) revealedCells++;
            }
        }
        if (revealedCells === (ROWS * COLS - MINES)) {
            triggerGameOver(true);
        }
    }

    // モード切り替えイベント
    modeDigBtn.addEventListener('click', () => {
        currentMode = 'dig';
        modeDigBtn.classList.add('active');
        modeFlagBtn.classList.remove('active');
    });
    modeFlagBtn.addEventListener('click', () => {
        currentMode = 'flag';
        modeFlagBtn.classList.add('active');
        modeDigBtn.classList.remove('active');
    });

    resetBtn.addEventListener('click', init);
    undoBtn.addEventListener('click', undo);
    answerBtn.addEventListener('click', showAnswer);
    difficultySelect.addEventListener('change', init);

    init();
</script>
</body>
</html>
