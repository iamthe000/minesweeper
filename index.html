<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マインスイーパ</title>
<style>
    body {
        background-color: #2c2c2c;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: 'MS Sans Serif', 'Segoe UI', Tahoma, sans-serif;
        -webkit-text-size-adjust: 100%;
    }
    
    .game-outer {
        max-width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    .game-container {
        background-color: #c0c0c0;
        padding: 6px;
        border-top: 3px solid #ffffff;
        border-left: 3px solid #ffffff;
        border-right: 3px solid #7b7b7b;
        border-bottom: 3px solid #7b7b7b;
        user-select: none;
        -webkit-user-select: none;
    }

    .header {
        background-color: #c0c0c0;
        border-top: 3px solid #7b7b7b;
        border-left: 3px solid #7b7b7b;
        border-right: 3px solid #ffffff;
        border-bottom: 3px solid #ffffff;
        padding: 5px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }

    .lcd {
        background-color: #000000;
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 24px;
        width: 48px;
        text-align: right;
        padding: 2px;
        border-top: 2px solid #7b7b7b;
        border-left: 2px solid #7b7b7b;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        line-height: 1;
    }

    .reset-btn {
        width: 32px;
        height: 32px;
        background-color: #c0c0c0;
        border-top: 3px solid #ffffff;
        border-left: 3px solid #ffffff;
        border-right: 3px solid #7b7b7b;
        border-bottom: 3px solid #7b7b7b;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
    }
    .reset-btn:active {
        border-top: 3px solid #7b7b7b;
        border-left: 3px solid #7b7b7b;
        border-right: 3px solid #ffffff;
        border-bottom: 3px solid #ffffff;
        background-color: #b0b0b0;
    }

    /* スマホはみ出し対策のスクロールラッパー */
    .grid-wrapper {
        max-width: 100%;
        height: 320px; /* 固定高さを設定するか、初期状態で余裕を持たせる */
        overflow: hidden;
        background-color: #7b7b7b;
        border-top: 3px solid #7b7b7b;
        border-left: 3px solid #7b7b7b;
        border-right: 3px solid #ffffff;
        border-bottom: 3px solid #ffffff;
        position: relative;
        touch-action: none; /* デフォルトのスクロールやピンチズームを禁止 */
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
    }
    .grid-wrapper:active {
        cursor: grabbing;
    }

    .grid {
        display: grid;
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
        touch-action: none;
    }

    .cell {
        width: 26px;
        height: 26px;
        background-color: #c0c0c0;
        border-top: 2px solid #ffffff;
        border-left: 2px solid #ffffff;
        border-right: 2px solid #7b7b7b;
        border-bottom: 2px solid #7b7b7b;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 16px;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .cell.revealed {
        border: 1px solid #7b7b7b;
        background-color: #c0c0c0;
    }

    .cell.mine-death {
        background-color: #ff0000;
    }

    .controls {
        margin-top: 8px;
        text-align: center;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px;
    }

    .action-btn {
        background-color: #c0c0c0;
        border-top: 2px solid #ffffff;
        border-left: 2px solid #ffffff;
        border-right: 2px solid #7b7b7b;
        border-bottom: 2px solid #7b7b7b;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        color: #000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
    }
    .action-btn:active, .action-btn.active {
        border-top: 2px solid #7b7b7b;
        border-left: 2px solid #7b7b7b;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        background-color: #e0e0e0;
    }
    .action-btn:disabled {
        color: #7b7b7b;
        cursor: not-allowed;
    }

    .mode-selector {
        margin-top: 8px;
        display: flex;
        justify-content: center;
        gap: 8px;
    }
    .mode-selector .action-btn {
        flex: 1;
        max-width: 120px;
        font-size: 14px;
        padding: 8px 0;
    }

    .num-1 { color: #0000ff; }
    .num-2 { color: #008000; }
    .num-3 { color: #ff0000; }
    .num-4 { color: #000080; }
    .num-5 { color: #800000; }
    .num-6 { color: #008080; }
    .num-7 { color: #000000; }
    .num-8 { color: #808080; }

    /* ズームコントローラー */
    .zoom-controls {
        margin-top: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
    }
    .zoom-info {
        background-color: #000000;
        color: #00ff00;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 14px;
        padding: 4px 8px;
        border-top: 2px solid #7b7b7b;
        border-left: 2px solid #7b7b7b;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        min-width: 48px;
        text-align: center;
    }
</style>
</head>
<body>

<div class="game-outer">
    <div class="game-container">
        <div class="header">
            <div class="lcd" id="mine-count">010</div>
            <div class="reset-btn" id="reset-btn">🙂</div>
            <div class="lcd" id="timer">000</div>
        </div>
        <div class="grid-wrapper">
            <div class="grid" id="grid"></div>
        </div>
    </div>
    
    <div class="mode-selector">
        <button class="action-btn active" id="mode-dig">⛏️ 掘る</button>
        <button class="action-btn" id="mode-flag">🚩 旗 / ❓</button>
    </div>

    <div class="zoom-controls">
        <button class="action-btn" id="zoom-out-btn">🔍- 縮小</button>
        <div class="zoom-info" id="zoom-factor">100%</div>
        <button class="action-btn" id="zoom-in-btn">🔍+ 拡大</button>
        <button class="action-btn" id="zoom-reset-btn">等倍</button>
    </div>

    <div class="controls">
        <select id="difficulty" class="action-btn">
            <option value="9,9,10">初級 (9x9, 10個)</option>
            <option value="16,16,40">中級 (16x16, 40個)</option>
        </select>
        <button class="action-btn" id="undo-btn" disabled>1手戻る</button>
        <button class="action-btn" id="answer-btn">答え合わせ</button>
    </div>
</div>

<script>
    let ROWS = 9;
    let COLS = 9;
    let MINES = 10;
    
    let board = [];
    let isFirstClick = true;
    let gameOver = false;
    let flagsPlaced = 0;
    let timerInterval = null;
    let timeElapsed = 0;
    
    let currentMode = 'dig'; // 'dig' または 'flag'
    let historyStack = [];  // 行動履歴スタック (Undo用)

    const gridEl = document.getElementById('grid');
    const wrapperEl = document.querySelector('.grid-wrapper');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset-btn');
    const answerBtn = document.getElementById('answer-btn');
    const undoBtn = document.getElementById('undo-btn');
    const difficultySelect = document.getElementById('difficulty');
    const modeDigBtn = document.getElementById('mode-dig');
    const modeFlagBtn = document.getElementById('mode-flag');

    const zoomOutBtn = document.getElementById('zoom-out-btn');
    const zoomInBtn = document.getElementById('zoom-in-btn');
    const zoomResetBtn = document.getElementById('zoom-reset-btn');
    const zoomFactorEl = document.getElementById('zoom-factor');

    // ズーム＆パンのステート管理
    let scale = 1.0;
    let translateX = 0;
    let translateY = 0;
    
    // ドラッグ＆キャンセルフラグ
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let hasDragged = false;
    const DRAG_THRESHOLD = 5; // ピクセル単位

    // 2本指ズーム(ピンチ)ステート
    let initialPinchDistance = 0;
    let initialScale = 1.0;
    let initialPinchCenter = { x: 0, y: 0 };

    function updateTransform() {
        gridEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        zoomFactorEl.textContent = `${Math.round(scale * 100)}%`;
    }

    // 任意の画面(またはラッパー相対)座標 (pivotX, pivotY) を中心に、新しい倍率 newScale にズームする
    function zoomToPoint(newScale, pivotX, pivotY) {
        newScale = Math.max(0.5, Math.min(4.0, newScale));
        
        // ラッパー相対座標でのピボットを、変形前のグリッドのローカル座標に逆算
        const localX = (pivotX - translateX) / scale;
        const localY = (pivotY - translateY) / scale;
        
        // 新しいスケールでの、同じローカル座標のラッパー内での位置
        const newPivotX = localX * newScale + translateX;
        const newPivotY = localY * newScale + translateY;
        
        // ピボット位置がずれないように平行移動量を調整
        translateX += (pivotX - newPivotX);
        translateY += (pivotY - newPivotY);
        scale = newScale;
        
        updateTransform();
    }

    function init() {
        clearInterval(timerInterval);
        timeElapsed = 0;
        timerEl.textContent = '000';
        isFirstClick = true;
        gameOver = false;
        flagsPlaced = 0;
        resetBtn.textContent = '🙂';
        historyStack = [];
        updateUndoButton();
        
        const diffValues = difficultySelect.value.split(',').map(Number);
        ROWS = diffValues[0];
        COLS = diffValues[1];
        MINES = diffValues[2];

        updateMineCount();
        
        gridEl.style.gridTemplateColumns = `repeat(${COLS}, 26px)`;
        gridEl.innerHTML = '';
        board = [];

        // ズーム・パン状態を初期状態（等倍かつ左寄せ・中央寄せ基準）にリセット
        scale = 1.0;
        translateX = 0;
        translateY = 0;
        isDragging = false;
        hasDragged = false;
        updateTransform();

        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                const cellEl = document.createElement('div');
                cellEl.classList.add('cell');
                cellEl.dataset.r = r;
                cellEl.dataset.c = c;
                
                // PC用右クリック / スマホ用長押しメニューの禁止
                cellEl.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    toggleMark(r, c);
                });

                cellEl.addEventListener('mousedown', (e) => {
                    if (gameOver) return;
                    if (e.button === 0 && currentMode === 'dig') resetBtn.textContent = '😮';
                });

                cellEl.addEventListener('mouseup', handleMouseUp);

                // PC用ダブルクリックコード機能
                cellEl.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    chordReveal(r, c);
                });

                gridEl.appendChild(cellEl);
                row.push({
                    r, c, el: cellEl,
                    isMine: false, isRevealed: false, markState: 0, neighborMines: 0
                });
            }
            board.push(row);
        }
    }

    // 履歴を保存する関数
    function saveHistory() {
        const snapshot = {
            boardState: board.map(row => row.map(cell => ({
                isRevealed: cell.isRevealed,
                markState: cell.markState
            }))),
            flagsPlaced: flagsPlaced,
            gameOver: gameOver
        };
        historyStack.push(snapshot);
        updateUndoButton();
    }

    // 1手戻る (Undo)
    function undo() {
        if (historyStack.length === 0) return;

        const snapshot = historyStack.pop();
        flagsPlaced = snapshot.flagsPlaced;
        
        const wasGameOver = gameOver;
        gameOver = snapshot.gameOver;

        if (wasGameOver && !gameOver) {
            resetBtn.textContent = '🙂';
            startTimer();
        }

        // 盤面状態の復元
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = board[r][c];
                const saved = snapshot.boardState[r][c];
                
                cell.isRevealed = saved.isRevealed;
                cell.markState = saved.markState;
                
                // 表示とスタイルのリセット
                cell.el.className = 'cell';
                if (cell.isRevealed) {
                    cell.el.classList.add('revealed');
                    if (cell.isMine) {
                        cell.el.classList.add('mine-death');
                        cell.el.textContent = '💣';
                    } else if (cell.neighborMines > 0) {
                        cell.el.textContent = cell.neighborMines;
                        cell.el.classList.add(`num-${cell.neighborMines}`);
                    } else {
                        cell.el.textContent = '';
                    }
                } else {
                    updateCellMarkDisplay(cell);
                }
            }
        }
        updateMineCount();
        updateUndoButton();
    }

    function updateUndoButton() {
        undoBtn.disabled = historyStack.length === 0;
    }

    function generateSolvableBoard(startR, startC) {
        let attempts = 0;
        const maxAttempts = 300;

        while (attempts < maxAttempts) {
            attempts++;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    board[r][c].isMine = false;
                    board[r][c].neighborMines = 0;
                }
            }

            let minesPlaced = 0;
            while (minesPlaced < MINES) {
                let r = Math.floor(Math.random() * ROWS);
                let c = Math.floor(Math.random() * COLS);
                if (Math.abs(r - startR) <= 1 && Math.abs(c - startC) <= 1) continue;

                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            calculateNeighbors();

            if (isBoardSolvable(startR, startC)) return;
        }
    }

    function calculateNeighbors() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c].isMine) continue;
                let count = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) count++;
                    }
                }
                board[r][c].neighborMines = count;
            }
        }
    }

    function isBoardSolvable(startR, startC) {
        let simState = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        let revealedCount = 0;

        function simReveal(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS || simState[r][c] !== 0) return;
            simState[r][c] = 1;
            revealedCount++;
            if (board[r][c].neighborMines === 0) {
                for(let dr=-1; dr<=1; dr++){
                    for(let dc=-1; dc<=1; dc++){
                        simReveal(r+dr, c+dc);
                    }
                }
            }
        }

        simReveal(startR, startC);

        let progress = true;
        while(progress) {
            progress = false;
            for(let r=0; r<ROWS; r++){
                for(let c=0; c<COLS; c++){
                    if (simState[r][c] === 1 && board[r][c].neighborMines > 0) {
                        let unrevealed = [];
                        let flagged = 0;
                        for(let dr=-1; dr<=1; dr++){
                            for(let dc=-1; dc<=1; dc++){
                                let nr = r+dr, nc = c+dc;
                                if(nr>=0 && nr<ROWS && nc>=0 && nc<COLS) {
                                    if(simState[nr][nc] === 0) unrevealed.push({r: nr, c: nc});
                                    if(simState[nr][nc] === 2) flagged++;
                                }
                            }
                        }

                        let target = board[r][c].neighborMines;
                        if (unrevealed.length > 0 && target === flagged + unrevealed.length) {
                            unrevealed.forEach(cell => { simState[cell.r][cell.c] = 2; progress = true; });
                        }
                        else if (unrevealed.length > 0 && target === flagged) {
                            unrevealed.forEach(cell => { simReveal(cell.r, cell.c); progress = true; });
                        }
                    }
                }
            }
        }
        return revealedCount === (ROWS * COLS - MINES);
    }

    function handleMouseUp(e) {
        if (gameOver) return;
        resetBtn.textContent = '🙂';
        
        // ドラッグ移動を行っていた場合はクリックイベントを無視(誤クリック防止)
        if (hasDragged) {
            hasDragged = false;
            return;
        }

        const r = parseInt(e.target.dataset.r);
        const c = parseInt(e.target.dataset.c);
        if (isNaN(r) || isNaN(c)) return;

        if (e.button === 0) { // 左クリックまたはスマホタップ
            if (currentMode === 'dig') {
                if (!board[r][c].isRevealed && board[r][c].markState !== 1) {
                    saveHistory(); // 掘る前に履歴を保存
                    revealCell(r, c);
                }
            } else {
                toggleMark(r, c);
            }
        }
    }

    function revealCell(r, c) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
        let cell = board[r][c];
        if (cell.isRevealed || cell.markState === 1) return;

        if (isFirstClick) {
            isFirstClick = false;
            generateSolvableBoard(r, c);
            startTimer();
        }

        cell.isRevealed = true;
        cell.el.classList.add('revealed');
        cell.el.textContent = ''; 

        if (cell.isMine) {
            cell.el.classList.add('mine-death');
            cell.el.textContent = '💣';
            triggerGameOver(false);
            return;
        }

        if (cell.neighborMines > 0) {
            cell.el.textContent = cell.neighborMines;
            cell.el.classList.add(`num-${cell.neighborMines}`);
        } else {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    revealCell(r + dr, c + dc);
                }
            }
        }
        checkWin();
    }


    function toggleMark(r, c) {
        if (gameOver || isFirstClick) return;
        let cell = board[r][c];
        if (cell.isRevealed) return;

        saveHistory(); // 状態変更前に履歴を保存

        const prevState = cell.markState;
        cell.markState = (cell.markState + 1) % 3;

        if (prevState === 1) flagsPlaced--;
        if (cell.markState === 1) flagsPlaced++;

        updateCellMarkDisplay(cell);
        updateMineCount();
    }

    function updateCellMarkDisplay(cell) {
        if (cell.markState === 1) {
            cell.el.textContent = '🚩';
        } else if (cell.markState === 2) {
            cell.el.textContent = '❓';
        } else {
            cell.el.textContent = '';
        }
    }
    
    // コード機能
    function chordReveal(r, c) {
        if (gameOver) return;
        let cell = board[r][c];
        if (!cell.isRevealed || cell.neighborMines === 0) return;
        
        let flaggedNeighbors = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (board[nr][nc].markState === 1) flaggedNeighbors++;
                }
            }
        }
        
        if (flaggedNeighbors === cell.neighborMines) {
            let willReveal = false;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (board[nr][nc].markState !== 1 && !board[nr][nc].isRevealed) willReveal = true;
                    }
                }
            }

            if (willReveal) {
                saveHistory();
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            if (board[nr][nc].markState !== 1 && !board[nr][nc].isRevealed) revealCell(nr, nc);
                        }
                    }
                }
            }
        }
    }

    function updateMineCount() {
        let count = MINES - flagsPlaced;
        mineCountEl.textContent = count.toString().padStart(3, '0').replace('-', '-0');
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeElapsed++;
            if (timeElapsed > 999) timeElapsed = 999;
            timerEl.textContent = timeElapsed.toString().padStart(3, '0');
        }, 1000);
    }

    function showAnswer() {
        if (isFirstClick) return;
        saveHistory();
        triggerGameOver(false, true);
    }

    function triggerGameOver(isWin, isAnswerCheck = false) {
        gameOver = true;
        clearInterval(timerInterval);
        
        if (isWin) {
            resetBtn.textContent = '😎';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].isMine && board[r][c].markState !== 1) {
                        board[r][c].markState = 1;
                        board[r][c].el.textContent = '🚩';
                        flagsPlaced++;
                    }
                }
            }
            updateMineCount();
        } else {
            resetBtn.textContent = isAnswerCheck ? '😐' : '😵';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let cell = board[r][c];
                    if (cell.isMine && cell.markState !== 1) {
                        cell.el.classList.add('revealed');
                        cell.el.textContent = '💣';
                    } else if (!cell.isMine && cell.markState === 1) {
                        cell.el.textContent = '❌';
                    }
                }
            }
        }
    }

    function checkWin() {
        let revealedCells = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c].isRevealed) revealedCells++;
            }
        }
        if (revealedCells === (ROWS * COLS - MINES)) {
            triggerGameOver(true);
        }
    }

    // モード切り替えイベント
    modeDigBtn.addEventListener('click', () => {
        currentMode = 'dig';
        modeDigBtn.classList.add('active');
        modeFlagBtn.classList.remove('active');
    });
    modeFlagBtn.addEventListener('click', () => {
        currentMode = 'flag';
        modeFlagBtn.classList.add('active');
        modeDigBtn.classList.remove('active');
    });

    resetBtn.addEventListener('click', init);
    undoBtn.addEventListener('click', undo);
    answerBtn.addEventListener('click', showAnswer);
    difficultySelect.addEventListener('change', init);

    // ホイールズームイベントの実装
    wrapperEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        
        // マウスポインタの、ラッパー要素左上からの相対座標を取得
        const rect = wrapperEl.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // ホイール方向によりスケールを決定
        const delta = e.deltaY < 0 ? 1.1 : 0.9;
        const newScale = scale * delta;
        zoomToPoint(newScale, mouseX, mouseY);
    }, { passive: false });

    // 1本指ドラッグ、2本指ピンチズーム用のタッチ＆マウスイベント群

    // マウスドラッグ（パン）の実装
    wrapperEl.addEventListener('mousedown', (e) => {
        // セルのドラッグ開始。セル自体が右クリックの場合は除外
        if (e.button !== 0 && e.button !== 1) return;
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        hasDragged = false;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const currentX = e.clientX - startX;
        const currentY = e.clientY - startY;
        
        // 移動量がしきい値を超えたかどうか
        if (Math.abs(currentX - translateX) > DRAG_THRESHOLD || Math.abs(currentY - translateY) > DRAG_THRESHOLD) {
            hasDragged = true;
        }
        
        translateX = currentX;
        translateY = currentY;
        updateTransform();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    // 2つのタッチ点間の距離を計算する
    function getDistance(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // 2つのタッチ点の中央座標をラッパー相対で計算する
    function getTouchCenter(t1, t2, rect) {
        return {
            x: ((t1.clientX + t2.clientX) / 2) - rect.left,
            y: ((t1.clientY + t2.clientY) / 2) - rect.top
        };
    }

    // タッチイベント（スマホ対応、ピンチ＆ドラッグパン）
    wrapperEl.addEventListener('touchstart', (e) => {
        const rect = wrapperEl.getBoundingClientRect();
        hasDragged = false;

        if (e.touches.length === 1) {
            // 1本指でのドラッグ移動開始
            isDragging = true;
            startX = e.touches[0].clientX - translateX;
            startY = e.touches[0].clientY - translateY;
        } else if (e.touches.length === 2) {
            // 2本指でのピンチズーム開始
            isDragging = false; // ピンチ時は1本指ドラッグを停止
            initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
            initialScale = scale;
            initialPinchCenter = getTouchCenter(e.touches[0], e.touches[1], rect);
        }
    }, { passive: true });

    wrapperEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
            // 1本指ドラッグ
            const currentX = e.touches[0].clientX - startX;
            const currentY = e.touches[0].clientY - startY;

            if (Math.abs(currentX - translateX) > DRAG_THRESHOLD || Math.abs(currentY - translateY) > DRAG_THRESHOLD) {
                hasDragged = true;
            }

            translateX = currentX;
            translateY = currentY;
            updateTransform();
        } else if (e.touches.length === 2) {
            // 2本指ピンチズーム
            const currentDistance = getDistance(e.touches[0], e.touches[1]);
            if (initialPinchDistance > 0) {
                const rect = wrapperEl.getBoundingClientRect();
                const currentCenter = getTouchCenter(e.touches[0], e.touches[1], rect);

                // ピンチによる拡大率の計算
                const pinchFactor = currentDistance / initialPinchDistance;
                const newScale = initialScale * pinchFactor;

                // 新しい中心点の移動分も加味してズーム
                zoomToPoint(newScale, currentCenter.x, currentCenter.y);
                hasDragged = true; // ピンチ時もクリックをキャンセルする
            }
        }
    }, { passive: true });

    wrapperEl.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
            isDragging = false;
        } else if (e.touches.length === 1) {
            // 2本指から1本指に戻った場合の処理
            isDragging = true;
            startX = e.touches[0].clientX - translateX;
            startY = e.touches[0].clientY - translateY;
        }
    }, { passive: true });

    wrapperEl.addEventListener('touchcancel', () => {
        isDragging = false;
    });

    // ズームボタンの実装
    zoomInBtn.addEventListener('click', () => {
        const rect = wrapperEl.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        zoomToPoint(scale * 1.2, centerX, centerY);
    });

    zoomOutBtn.addEventListener('click', () => {
        const rect = wrapperEl.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        zoomToPoint(scale / 1.2, centerX, centerY);
    });

    zoomResetBtn.addEventListener('click', () => {
        scale = 1.0;
        // グリッドをラッパー内で中央、または左上にリセット
        translateX = 0;
        translateY = 0;
        updateTransform();
    });

    init();
</script>
</body>
</html>
